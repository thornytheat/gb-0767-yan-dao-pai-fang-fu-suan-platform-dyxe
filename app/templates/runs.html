<section class="panel"><h2>监测留档</h2><div class="scroll"><table><thead><tr><th>归档编号</th><th>来源</th><th>时间 UTC</th><th>耗时 ms</th><th>核验</th></tr></thead><tbody>{% for item in history %}<tr><td><a href="{{ url_for('desk.show',page='evidence',run=item.run_id) }}">{{ item.run_id[:16] }}</a></td><td>{{ item.source }}</td><td>{{ item.created_utc }}</td><td>{{ item.elapsed_ms }}</td><td>{{ verifications.get(item.verification, '—') }}</td></tr>{% else %}<tr><td colspan="5">先归档一份监测原件。</td></tr>{% endfor %}</tbody></table></div></section>
<section class="panel"><h2>证据单恢复</h2><p>留档丢失后用已签发证据单恢复，编号沿用签发时的归档编号。</p><form id="restore-form" enctype="multipart/form-data"><label>证据单 JSON <input type="file" id="restore-file" accept="application/json,.json" required></label><button type="submit">恢复留档</button></form><p id="restore-feedback" role="status" hidden></p></section>
